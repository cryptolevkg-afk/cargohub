# Локальный запуск: docker compose up
# Поднимает PostgreSQL + API одной командой, схема применяется автоматически
# при первом старте контейнера db (через docker-entrypoint-initdb.d).
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cargohub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cargohub_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:cargohub_dev@db:5432/cargohub
      JWT_SECRET: change_me_to_a_long_random_string
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  pgdata:
